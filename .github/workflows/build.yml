name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true
      force_all:
        type: boolean
        required: false
        default: false

  workflow_dispatch:
    inputs:
      force_all:
        description: "Build all enabled apps, even if unchanged"
        type: boolean
        required: false
        default: false

jobs:
  run:
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Make scripts and helper binaries executable
        run: chmod +x build.sh utils.sh build-termux.sh bin/toml/* bin/htmlq/* bin/aapt2/* 2>/dev/null || true

      - name: Get apkeep (APKPure-only APK downloader)
        run: |
          curl -fSL --retry 3 -o bin/apkeep https://github.com/EFForg/apkeep/releases/download/1.1.0/apkeep-x86_64-unknown-linux-gnu
          chmod +x bin/apkeep
          bin/apkeep --version

      - name: Update config
        id: update_cfg
        if: ${{ inputs.force_all != true }}
        run: |
          SKIP=false
          SEED_ONLY=false
          if git checkout origin/update build.md 2>/dev/null; then
            git checkout origin/update build-state.txt 2>/dev/null || :
            UPDATE_CFG=$(bash ./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
            elif [ ! -f build-state.txt ] && [ -s temp/seed-state.txt ]; then
              echo "No state file yet; freshly seeding build-state.txt only (nothing to build)."
              SKIP=true
              SEED_ONLY=true
            elif [ -f build-state.txt ]; then
              echo "Nothing changed since the last build - skipping."
              SKIP=true
            fi
          fi
          echo "SKIP=$SKIP" >> "$GITHUB_OUTPUT"
          echo "SEED_ONLY=$SEED_ONLY" >> "$GITHUB_OUTPUT"
          if [ "$SKIP" != "true" ]; then
            CFG_FILE=config.json; [ -f "$CFG_FILE" ] || CFG_FILE=config.toml
            SUPERPACK=$(python3 -c "
          import sys, json
          try:
              import tomllib
              d = tomllib.load(open(sys.argv[1], 'rb'))
          except Exception:
              d = json.load(open(sys.argv[1]))
          print('true' if any(isinstance(v, dict) and v.get('superpack-unpack') is True and v.get('enabled', True) for v in d.values()) else 'false')
          " "$CFG_FILE")
            echo "SUPERPACK_NEEDED=$SUPERPACK" >> "$GITHUB_OUTPUT"
          else
            echo "SUPERPACK_NEEDED=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable KVM for the Android emulator (GitHub runners expose /dev/kvm but not to the runner user)
        id: superpack_kvm
        if: ${{ inputs.force_all == true || steps.update_cfg.outputs.SUPERPACK_NEEDED == 'true' }}
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Boot Android emulator (apps with superpack-unpack need it)
        id: superpack_emulator
        if: ${{ inputs.force_all == true || steps.update_cfg.outputs.SUPERPACK_NEEDED == 'true' }}
        shell: bash
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "emulator" "platform-tools" "system-images;android-29;google_apis;x86_64"
          echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd --force -n ci-superpack -k "system-images;android-29;google_apis;x86_64" -d "pixel_2" \
            || echo no | "$SDK/cmdline-tools/latest/bin/avdmanager" create avd --force -n ci-superpack -k "system-images;android-29;google_apis;x86_64"
          nohup "$SDK/emulator/emulator" -avd ci-superpack -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-metrics > emulator.log 2>&1 &
          echo $! > emulator.pid
          ADB="$SDK/platform-tools/adb"
          timeout 90 "$ADB" wait-for-device || true
          boot=""
          for i in $(seq 1 150); do
            boot=$("$ADB" shell getprop sys.boot_completed | tr -d '\r' || true)
            if [ "$boot" = "1" ]; then echo "emulator booted after ~$((i * 2))s"; break; fi
            sleep 2
          done
          if [ "$boot" != "1" ]; then echo "emulator did not boot in time"; cat emulator.log || true; exit 1; fi
          echo "ANDROID_SERIAL=$("$ADB" get-serialno | tr -d '\r')" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 --json tagName --jq '(.[0].tagName // "0")')
          if [ -z "$TAG" ]; then TAG=0; fi
          if ! [[ "$TAG" =~ ^[0-9]+$ ]]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build modules/APKs
        if: steps.update_cfg.outputs.SKIP != 'true'
        run: if [ -f "config.json" ]; then bash ./build.sh config.json; else bash ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Stop the Android emulator
        if: ${{ always() && steps.superpack_emulator.outcome != 'skipped' }}
        shell: bash
        run: pkill -f "ci-superpack" || true

      - name: Get output
        id: get_output
        if: steps.update_cfg.outputs.SKIP != 'true'
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
      
      - name: Upload release
        if: steps.update_cfg.outputs.SKIP != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          ls -lh ./build/*
          gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"

      - name: Update modules changelog and update json
        id: update_config
        if: steps.update_cfg.outputs.SKIP != 'true'
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          touch build-state.txt
          : > built-state-updates.txt
          if [ -f temp/seed-state.txt ]; then cat temp/seed-state.txt >> built-state-updates.txt; fi
          if [ -f temp/built-state.txt ]; then cat temp/built-state.txt >> built-state-updates.txt; fi
          if [ -s built-state-updates.txt ]; then
            awk -F'|' 'NR==FNR { new[$1]=$0; next } { if (!($1 in new)) print } END { for (t in new) print new[t] }' built-state-updates.txt build-state.txt | sort > build-state.tmp
            mv -f build-state.tmp build-state.txt
          fi
          rm -f built-state-updates.txt
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

      - name: Commit module json changes
        if: steps.update_cfg.outputs.SKIP != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add -f build.md build-state.txt
          find . -name '*-update.json' -print0 | xargs -0 -r git add
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Commit seeded build-state
        if: steps.update_cfg.outputs.SEED_ONLY == 'true'
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f temp/seed-state.txt build-state.txt
          git add -f build-state.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Seed build-state.txt"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

