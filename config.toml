# my-morphe-builder - builds patched APKs with Morphe patches
# see https://github.com/hxreborn/morphe-patches, https://github.com/Akash-Sriram/morphe-google-photos, https://github.com/heval99/Heval-Morphe-Patches and https://github.com/SysAdminDoc/HushPinterest
# see CONFIG.md for the full list of options
enable-module-update = false # release-only flow, no Magisk module update manifests
parallel-jobs = 1

[Notesnook]
app-name = "Notesnook"
enabled = true
build-mode = "apk" # 'both', 'apk' or 'module'
patches-source = "hxreborn/morphe-patches"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
# arm64-v8a only by policy; the official endpoint serves the arm64-v8a build
version = "auto" # highest version supported by the patches
arch = "arm64-v8a"
# official Notesnook download endpoint (302 -> official GitHub release asset)
pkg-name = "com.streetwriters.notesnook"
official-dlurl = "https://notesnook.com/api/v1/releases/android/latest/arm64-v8a"
# alternative: apkeep from APKPure (kept for later testing). WARNING: there the
# 3.4.12/3.4.13/3.4.15 XAPKs are armeabi-v7a-only, so also pin version = "3.4.14".
# apkpure-dlurl = "com.streetwriters.notesnook"

[GooglePhotos]
app-name = "Google Photos"
build-mode = "apk"
patches-source = "Akash-Sriram/morphe-google-photos"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
# manually pinned. MGP v1.17.10 officially targets 7.99.0.1007655401 only; this
# newer build is force-patched (-f) and patches are best-effort. Check their
# patches-list.json before bumping, and bump only after verifying the build.
version = "7.99.0.1012983279"
# APKPure serves this version as an XAPK with an arm64-v8a split (no other ABIs);
# APKEditor merges it into a single APK before patching.
arch = "arm64-v8a"
apkpure-dlurl = "com.google.android.apps.photos"

[Truecaller]
app-name = "Truecaller"
build-mode = "apk"
patches-source = "heval99/Heval-Morphe-Patches"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
# heval99's Truecaller patches target 26.43.5 only; 'auto' resolves to the
# highest version the patches support. APKPure serves it as an XAPK with an
# arm64-v8a split; APKEditor merges it into a single APK before patching.
# The patches keep the package name com.truecaller (no rename).
version = "auto"
arch = "arm64-v8a"
apkpure-dlurl = "com.truecaller"

[Pinterest]
app-name = "Pinterest"
build-mode = "apk"
# pinned by the user: newer HushPinterest releases target Pinterest versions
# APKPure doesn't mirror (APKPure's newest is 14.25.0). v0.0.5 targets
# 14.25.0 and 14.38.0, both official. 14.25.0 is on APKPure.
patches-source = "SysAdminDoc/HushPinterest"
patches-version = "v0.0.5"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
# 'auto' would resolve to 14.38.0 here - which APKPure doesn't have - so the
# version is pinned to 14.25.0 (official target of v0.0.5; pin passes -f,
# harmless, the patches match this exact build). APKPure serves it as an
# XAPK; APKEditor merges it into a single APK before patching.
# v0.0.5 has 23 patches and NO 'GmsCore support' / 'Fix push notifications'
# patches (those came later), so Google services are untouched - sign in with
# email + password; Google sign-in can't work on a re-signed app anyway.
# Bump to a newer HushPinterest (and version) once APKPure mirrors a build a
# newer release supports.
version = "14.25.0"
arch = "arm64-v8a"
apkpure-dlurl = "com.pinterest"
