# my-morphe-builder - builds patched APKs with Morphe patches
# see https://github.com/hxreborn/morphe-patches, https://github.com/heval99/Heval-Morphe-Patches, https://github.com/SysAdminDoc/HushPinterest and https://github.com/SysAdminDoc/HushFacebook
# see CONFIG.md for the full list of options
enable-module-update = false # release-only flow, no Magisk module update manifests
parallel-jobs = 1

[Notesnook]
app-name = "Notesnook"
enabled = true
build-mode = "apk" # 'both', 'apk' or 'module'
patches-source = "hxreborn/morphe-patches"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
# arm64-v8a only by policy; the official endpoint serves the arm64-v8a build
version = "auto" # highest version supported by the patches
arch = "arm64-v8a"
# official Notesnook download endpoint (302 -> official GitHub release asset)
pkg-name = "com.streetwriters.notesnook"
official-dlurl = "https://notesnook.com/api/v1/releases/android/latest/arm64-v8a"
# alternative: apkeep from APKPure (kept for later testing). WARNING: there the
# 3.4.12/3.4.13/3.4.15 XAPKs are armeabi-v7a-only, so also pin version = "3.4.14".
# apkpure-dlurl = "com.streetwriters.notesnook"

[Truecaller]
app-name = "Truecaller"
build-mode = "apk"
patches-source = "heval99/Heval-Morphe-Patches"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
# heval99's Truecaller patches target 26.43.5 only; 'auto' resolves to the
# highest version the patches support. APKPure serves it as an XAPK with an
# arm64-v8a split; APKEditor merges it into a single APK before patching.
# The patches keep the package name com.truecaller (no rename).
version = "auto"
arch = "arm64-v8a"
apkpure-dlurl = "com.truecaller"

[Pinterest]
app-name = "Pinterest"
build-mode = "apk"
# pinned by the user: newer HushPinterest releases target Pinterest versions
# APKPure doesn't mirror (APKPure's newest is 14.25.0). v0.0.5 targets
# 14.25.0 and 14.38.0, both official. 14.25.0 is on APKPure.
patches-source = "SysAdminDoc/HushPinterest"
patches-version = "v0.0.5"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
# 'auto' would resolve to 14.38.0 here - which APKPure doesn't have - so the
# version is pinned to 14.25.0 (official target of v0.0.5; pin passes -f,
# harmless, the patches match this exact build). APKPure serves it as an
# XAPK; APKEditor merges it into a single APK before patching.
# v0.0.5 has 23 patches and NO 'GmsCore support' / 'Fix push notifications'
# patches (those came later), so Google services are untouched - sign in with
# email + password; Google sign-in can't work on a re-signed app anyway.
# Bump to a newer HushPinterest (and version) once APKPure mirrors a build a
# newer release supports.
version = "14.25.0"
arch = "arm64-v8a"
apkpure-dlurl = "com.pinterest"

[Facebook]
# HushFacebook patches officially support only the Android 11+ builds of
# 586.0.0.52.53 (APKMirror). APKPure only serves the Android 9+ build, whose
# DEX files sit in a Superpack store the patcher can't read - so after the
# APK is downloaded and merged, CI decodes its store on the runner itself,
# with the arm64 library running under unidbg (the upstream -Desktop mode of
# scripts/superpack-unpack.ps1). The decode is verified against the SHA-1
# hashes inside the APK's own metadata.txt. Needs JDK 21+ on the runner,
# which the build job already has. The maintainer confirmed a patched unpack
# works (Home/Reels), not on a phone.
patches-source = "SysAdminDoc/HushFacebook"
patches-version = "latest"
cli-source = "MorpheApp/morphe-cli"
cli-version = "latest"
version = "auto" # resolves to 586.0.0.52.53 (highest version the patches support)
arch = "arm64-v8a"
apkpure-dlurl = "com.facebook.katana"
# runs the upstream superpack desktop unpacker after the download+merge
# step, before patching. No phone or emulator needed.
superpack-unpack = true
# "Tab bar at the bottom" is the one patch that refuses to patch on the
# Android 9+ build (its target code is obfuscated differently from the
# Android 11+ build the patch was written for) - excluded 2026-11-15; the
# measurement run showed it's the only failure. If a NEW patch starts
# failing, the Facebook build now fails loudly instead of silently shipping
# more missing patches. Note: excluding it means no "Tab bar at the bottom"
# feature; everything else applies. Changing this key doesn't retrigger a
# build - use force_all.
excluded-patches = "\"Tab bar at the bottom\""
# the -Desktop mode isn't in any release yet (v0.22.0 predates it), so the
# fetch is pinned to a main commit (2026-11-15). Once a release with
# -Desktop ships, drop this line and the unpacker follows the patches'
# release tag instead.
superpack-ref = "2301cfafe97fe75510700c3d872ef7987d4183c4"
